<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Shaheer">
        <meta name="description" content="LTS Contact">
        <title>LTS Contact Page</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="favicon" href="favicon.ico" type="image/x-icon">
    </head>
    <body>
        <header>
            <h1>Contact Us</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#about">About LTS</a></li>
                    <li><a href="index.html#menu">Our Menu</a></li>
                    <li><a href="hours.html">Store Hours</a></li>
                </ul>
            </nav>
            <figure>
                <img src="img/tacos_close_up_400x260.png" alt="Tacos Close Up" width="400" height="260">
                <figcaption>Little Taco Shop Tacos</figcaption>
            </figure>
        </header>
        <hr>
        <main>
            <section>
                <h2>Our Contact Form</h2>
                <form action="https://httpbin.org/get" method="get">
                    <fieldset>
                    <legend>Send Us A Message</legend>
                    <p>
                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="Your Name">
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="Your Email">
                    </p>
                    <p>
                        <label for="message">Your Message:</label>
                        <br>
                        <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here!"></textarea>
                    </p>
                    </fieldset>
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </form>
            </section>
            <section>
                <h2>Our Location</h2>
                <p>
                    <address>
                        555 Taco Temptation Lane, Suite T Kansas City,<br>
                        MO 55555-5555
                    </address>
                </p>
                <p>
                    <em>Phone: </em><a href="tel:+1234567890">555-555-5555</a>
                </p>
            </section>
            <p><a href="#">Back to Top</a></p>
        </main>
        <hr>
        <footer>
            <p>Copyright &copy; Little Taco Shop</p>
        </footer>
    </body>
</html>
